name: Build NoyonAI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "NoyonAI_v1.2_GitHub_Actions.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        run: |
          unzip -q NoyonAI_v1.2_GitHub_Actions.zip -d extracted
          test -f extracted/NoyonAI/app/build.gradle.kts
          test -f extracted/NoyonAI/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: extracted/NoyonAI
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoyonAI-v1.2-debug-apk
          path: extracted/NoyonAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
