name: Build NoyonAI Project 6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "project6-upgrade" ]
    paths:
      - "NoyonAI_v1.2_GitHub_Actions.zip"
      - "apply_pro_upgrade.py"
      - ".github/workflows/android.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "project6-apk-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        run: |
          unzip -q NoyonAI_v1.2_GitHub_Actions.zip -d extracted
          test -f extracted/NoyonAI/app/build.gradle.kts
          test -f extracted/NoyonAI/settings.gradle.kts
          python3 apply_pro_upgrade.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: extracted/NoyonAI
        run: gradle assembleDebug --no-daemon

      - name: Prepare public member download
        run: |
          mkdir -p project6/download
          cp extracted/NoyonAI/app/build/outputs/apk/debug/app-debug.apk project6/download/NoyonAI-Project6.apk
          test -s project6/download/NoyonAI-Project6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoyonAI-Project6-APK
          path: project6/download/NoyonAI-Project6.apk
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public download page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project6

      - name: Deploy public download
        id: deployment
        uses: actions/deploy-pages@v4

# Project 6 APK is built from the existing Android ZIP on the isolated branch.
# The APK is a debug build; do not treat it as a signed production release.
