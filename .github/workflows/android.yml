name: Build PAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "project6-upgrade" ]
    paths:
      - "PAIAndroid/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build PAI debug APK
        working-directory: PAIAndroid
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p project6/download
          cp PAIAndroid/app/build/outputs/apk/debug/app-debug.apk project6/download/PAI.apk
          test -s project6/download/PAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAI-Android-APK
          path: project6/download/PAI.apk
          if-no-files-found: error
          retention-days: 90
