name: Publish Project 6 Webpage
on:
  workflow_dispatch:
  push:
    branches:
      - project6-upgrade
    paths:
      - "project6/**"
      - ".github/workflows/project6-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "project6-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 6 branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload webpage
        uses: actions/upload-pages-artifact@v3
        with:
          path: project6
      - name: Deploy webpage
        id: deployment
        uses: actions/deploy-pages@v4
