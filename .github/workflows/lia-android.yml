name: LIA AI Android Build
on:
  workflow_dispatch:
  push:
    branches: [lia-ai-android]
    paths:
      - 'LIA-AI/**'
      - '.github/workflows/lia-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p LIA-AI assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LIA-AI-debug-APK
          path: LIA-AI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
