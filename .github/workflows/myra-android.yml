name: Build MYRA AI APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "MYRA-AI/**"
      - ".github/workflows/myra-android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build MYRA AI debug APK
        working-directory: MYRA-AI/android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-debug-apk
          path: MYRA-AI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
